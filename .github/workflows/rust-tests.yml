name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.90.0"
  NODE_VERSION: "22"
  CIRCOM_VERSION: "v2.2.2"
  SOLANA_VERSION: "stable"

jobs:
  test-rust:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          node-version: ${{ env.NODE_VERSION }}
          circom-version: ${{ env.CIRCOM_VERSION }}

      - name: Install Solana toolchain (for cargo build-sbf)
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build, test, bench (just ci)
        # Circuit build, workspace build, profiled SBF build, workspace
        # + all-features tests, BENCHMARKS.md regeneration and diff
        # check -- see the `ci` recipe in the justfile.
        run: just ci
        env:
          PROPTEST_CASES: "1000000"
